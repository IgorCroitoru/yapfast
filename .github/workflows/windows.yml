# Builds the Windows executable (yapfast.exe) and portable ZIP package, and
# uploads both as workflow artifacts on push, pull request, or manual dispatch.
name: Windows Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      flavour:
        description: "Build flavour (discord or full with Matrix)"
        type: choice
        options:
          - discord
          - full
        default: discord

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build yapfast.exe
    runs-on: ubuntu-latest
    env:
      FLAVOUR: ${{ inputs.flavour || 'discord' }}
    steps:
      # The runner's preinstalled SDKs leave too little room for the build.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # Skia built for Windows, and the MSVC CRT and SDK it was built against,
      # which nix/prepare-windows-skia.py checks before reusing it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo-xwin
            .local/windows/skia-static-production/build.json
            .local/windows/skia-static-production/prepared
          key: windows-skia-${{ hashFiles('nix/flake.lock', 'nix/prepare-windows-skia.py', 'nix/prepare-skia-native.py', 'nix/skia-windows-builder/**') }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Wine doesn't start on the GitHub-hosted runner (kernel32.dll, c0000135),
      # so Inno Setup is skipped and the portable ZIP + yapfast.exe are built.
      - name: Build Windows executable and package
        run: nix develop path:./nix#windows --command scripts/build-windows "$FLAVOUR" --no-installer

      - name: Upload yapfast.exe
        uses: actions/upload-artifact@v4
        with:
          name: yapfast-exe
          path: target/x86_64-pc-windows-msvc/release/yapfast.exe
          if-no-files-found: error

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: yapfast-windows-x64
          path: target/dist/${{ env.FLAVOUR }}/Yapfast-*-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
